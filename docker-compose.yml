services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: urbano_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - urbano_net

  nginx:
    image: nginx:alpine
    container_name: urbano_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - urbano_net

  db:
    image: mysql:8.0
    container_name: urbano_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: urbano_challenge
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "33061:3306"
    networks:
      - urbano_net

networks:
  urbano_net:
    driver: bridge

volumes:
  dbdata:
